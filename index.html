<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GameV</title>
<style>
body{margin:0;background:#0b1020;color:white;font-family:Arial}
header{text-align:center;background:#121a33;padding:20px}
.logo{font-size:30px;color:#6ea8fe;font-weight:bold}
main{max-width:800px;margin:auto;padding:25px 15px}
h1{text-align:center}
#products{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.card,form{background:#151e38;border:1px solid #263252;border-radius:15px;padding:20px;text-align:center}
.card{min-height:200px}
.price{color:#6ea8fe;font-size:20px;font-weight:bold;margin:15px}
button{background:#356ae6;color:white;border:0;padding:12px 20px;border-radius:9px;font-weight:bold}
form{display:none;margin:30px auto;max-width:450px}
input{display:block;width:100%;padding:12px;margin:10px 0 15px;box-sizing:border-box;background:#0b1020;color:white;border:1px solid #263252;border-radius:8px}
label{display:block;text-align:right}
#msg{margin-top:15px}
@media(max-width:650px){#products{grid-template-columns:1fr}}
</style>
</head>

<body>

<header><div class="logo">🎮 GameV</div></header>

<main>
<h1>🛒 المنتجات</h1>
<div id="products">جاري التحميل...</div>

<form id="form">
<h2>إتمام الطلب</h2>
<p id="product"></p>

<label>اسمك</label>
<input id="name" required>

<label>وسيلة التواصل</label>
<input id="contact" required>

<label>ID / Username الحساب</label>
<input id="account" required>

<label>كود بطاقة شحن Ooredoo</label>
<input id="card" required>

<button>إرسال الطلب</button>
<div id="msg"></div>
</form>
</main>

<script>
const URL="https://tdqmiagcwnwfrsplsctd.supabase.co";
const KEY="sb_publishable_txxhEzWBGgGXx_7vm2xiJg_OX5mKBjr";
let selected;

async function load(){
let r=await fetch(URL+"/rest/v1/products?select=*&status=eq.active",
{headers:{apikey:KEY,Authorization:"Bearer "+KEY}});
let p=await r.json();

document.getElementById("products").innerHTML=p.map(x=>`
<div class="card">
<h2>${x.title}</h2>
<p>${x.description||""}</p>
<div class="price">${x.price} DT</div>
<button onclick="buy(${x.id})">شراء</button>
</div>`).join("");
}

async function buy(id){
let r=await fetch(URL+"/rest/v1/products?id=eq."+id+"&select=*",
{headers:{apikey:KEY,Authorization:"Bearer "+KEY}});
selected=(await r.json())[0];

document.getElementById("product").innerText=
selected.title+" — "+selected.price+" DT";

document.getElementById("form").style.display="block";
document.getElementById("form").scrollIntoView({behavior:"smooth"});
}

document.getElementById("form").onsubmit=async e=>{
e.preventDefault();

let data={
customer_name:name.value,
customer_contact:contact.value,
game_account:account.value,
card_code:card.value,
price:selected.price,
payment_method_id:4,
status:"pending"
};

let r=await fetch(URL+"/rest/v1/orders",{
method:"POST",
headers:{
apikey:KEY,
Authorization:"Bearer "+KEY,
"Content-Type":"application/json",
Prefer:"return=minimal"
},
body:JSON.stringify(data)
});

msg.innerText=r.ok?"✅ تم إرسال الطلب":"❌ حدث خطأ";
if(r.ok)e.target.reset();
};

load();
</script>

</body>
  </html>
