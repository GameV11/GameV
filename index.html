<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameV</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
    }

    header {
      background: #121a33;
      padding: 18px;
      text-align: center;
      border-bottom: 1px solid #263252;
    }

    .logo {
      font-size: 30px;
      font-weight: bold;
      color: #6ea8fe;
    }

    .hero {
      text-align: center;
      padding: 50px 20px 30px;
    }

    .hero h1 {
      font-size: 38px;
      margin: 0 0 12px;
    }

    .hero p {
      color: #b9c2d0;
      font-size: 17px;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
      max-width: 850px;
      margin: auto;
      padding: 20px;
    }

    .game {
      background: #151e38;
      border: 1px solid #263252;
      border-radius: 18px;
      padding: 30px 20px;
      text-align: center;
    }

    .game-icon {
      font-size: 55px;
    }

    .game h2 {
      margin: 12px 0;
    }

    .btn {
      display: inline-block;
      padding: 12px 22px;
      margin-top: 10px;
      border-radius: 10px;
      background: #356ae6;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
