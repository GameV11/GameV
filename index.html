<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GameV</title>

<style>
body{margin:0;background:#0b1020;color:white;font-family:Arial}
header{text-align:center;background:#121a33;padding:20px}
.logo{font-size:30px;color:#6ea8fe;font-weight:bold}
main{max-width:800px;margin:auto;padding:25px 15px}
h1{text-align:center}
#products{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.card,form{background:#151e38;border:1px solid #263252;border-radius:15px;padding:20px;text-align:center}
.card{min-height:200px}
.card img{width:100%;height:180px;object-fit:cover;border-radius:10px;margin-bottom:10px}
.price{color:#6ea8fe;font-size:20px;font-weight:bold;margin:15px}
button{background:#356ae6;color:white;border:0;padding:12px 20px;border-radius:9px;font-weight:bold;cursor:pointer}
form{display:none;margin:30px auto;max-width:450px}
input{display:block;width:100%;padding:12px;margin:10px 0 15px;box-sizing:border-box;background:#0b1020;color:white;border:1px solid #263252;border-radius:8px}
label{display:block;text-align:right}
.cardInput{margin-bottom:12px}
#msg{margin-top:15px}
@media(max-width:650px){#products{grid-template-columns:1fr}}
</style>
</head>

<body>

<header>
<div class="logo">🎮 GameV</div>
</header>

<main>

<h1>🛒 المنتجات</h1>

<div id="products">جاري التحميل...</div>

<form id="form">

<h2>إتمام الطلب</h2>

<p id="product"></p>

<label>اسمك</label>
<input id="name" required>

<label>وسيلة التواصل</label>
<input id="contact" required>

<label>ID / Username الحساب</label>
<input id="account" required>

<div id="cards"></div>

<button type="submit">إرسال الطلب</button>

<div id="msg"></div>

</form>

</main>

<script>

const URL="https://tdqmiagcwnwfrsplsctd.supabase.co";
const KEY="sb_publishable_txxhEzWBGgGXx_7vm2xiJg_OX5mKBjr";

let selected=null;


async function load(){

try{

const r=await fetch(
URL+"/rest/v1/products?select=*&status=eq.active",
{
headers:{
apikey:KEY,
Authorization:"Bearer "+KEY
}
}
);

if(!r.ok) throw new Error(await r.text());

const products=await r.json();

const box=document.getElementById("products");

if(!products.length){
box.innerHTML="لا توجد منتجات حالياً";
return;
}

box.innerHTML=products.map(x=>`

<div class="card">

${x.image_url ? `
<img src="${x.image_url}" alt="${x.title}">
` : ""}

<h2>${x.title}</h2>

<p>${x.description||""}</p>

<div class="price">${x.price} DT</div>

<button type="button" onclick="buy(${x.id})">
شراء
</button>

</div>

`).join("");

}catch(error){

console.error(error);

document.getElementById("products").innerText=
"❌ تعذر تحميل المنتجات";

}

}


async function buy(id){

try{

const r=await fetch(
URL+"/rest/v1/products?id=eq."+id+"&select=*",
{
headers:{
apikey:KEY,
Authorization:"Bearer "+KEY
}
}
);

if(!r.ok) throw new Error(await r.text());

const products=await r.json();

if(!products.length){
alert("المنتج غير موجود");
return;
}

selected=products[0];

document.getElementById("product").innerText=
selected.title+" — "+selected.price+" DT";


const cardsBox=document.getElementById("cards");

cardsBox.innerHTML="";

const count=Number(selected.card_count)||1;

for(let i=1;i<=count;i++){

cardsBox.innerHTML+=`

<label>كود بطاقة Ooredoo ${i}</label>

<input
class="cardInput"
type="text"
id="card${i}"
placeholder="أدخل كود البطاقة ${i}"
required
>

`;

}


document.getElementById("form").style.display="block";

document.getElementById("form").scrollIntoView({
behavior:"smooth"
});

}catch(error){

console.error(error);

alert("حدث خطأ أثناء فتح المنتج");

}

}


document.getElementById("form").addEventListener(
"submit",
async function(e){

e.preventDefault();

if(!selected){
document.getElementById("msg").innerText=
"❌ اختر منتجاً أولاً";
return;
}

const msg=document.getElementById("msg");

msg.innerText="جاري إرسال الطلب...";


const count=Number(selected.card_count)||1;

let cards=[];

for(let i=1;i<=count;i++){

const value=document.getElementById("card"+i).value.trim();

cards.push(value);

}


const data={

customer_name:
document.getElementById("name").value.trim(),

customer_contact:
document.getElementById("contact").value.trim(),

game_account:
document.getElementById("account").value.trim(),

card_code:
cards.join(" | "),

price:selected.price,

payment_method_id:5,

status:"pending"

};


try{

const r=await fetch(
URL+"/rest/v1/orders",
{
method:"POST",

headers:{
apikey:KEY,
Authorization:"Bearer "+KEY,
"Content-Type":"application/json",
Prefer:"return=minimal"
},

body:JSON.stringify(data)

}
);


if(!r.ok){

const errorText=await r.text();

console.error(errorText);

msg.innerText=
"❌ خطأ: "+errorText;

return;

}


msg.innerText=
"✅ تم إرسال الطلب بنجاح!";

this.reset();

document.getElementById("cards").innerHTML="";

}catch(error){

console.error(error);

msg.innerText=
"❌ تعذر الاتصال بـ Supabase";

}

});


load();

</script>

</body>
  </html>
