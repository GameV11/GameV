<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GameV - الإدارة</title>
<style>
body{margin:0;background:#0b1020;color:white;font-family:Arial;padding:20px}
.box{max-width:900px;margin:auto}
.login,.admin{background:#151e38;border-radius:15px;padding:20px;margin:auto}
input{width:100%;padding:12px;margin:8px 0 15px;box-sizing:border-box;background:#0b1020;color:white;border:1px solid #263252;border-radius:8px}
button{background:#356ae6;color:white;border:0;padding:10px 18px;border-radius:8px;font-weight:bold;cursor:pointer}
#admin{display:none}
.order{background:#10182d;border:1px solid #263252;border-radius:12px;padding:15px;margin:12px 0}
select{padding:9px;background:#0b1020;color:white;border:1px solid #263252;border-radius:8px}
</style>
</head>

<body>
<div class="box">

<div id="login" class="login">
<h2>🔐 تسجيل دخول الإدارة</h2>

<input id="email" type="email" placeholder="البريد الإلكتروني">
<input id="password" type="password" placeholder="كلمة المرور">

<button onclick="login()">دخول</button>
<p id="loginMsg"></p>
</div>

<div id="admin" class="admin">
<h2>📋 طلبات GameV</h2>

<button onclick="loadOrders()">🔄 تحديث الطلبات</button>
<button onclick="logout()">خروج</button>

<div id="orders">جاري التحميل...</div>
</div>

</div>

<script>
const URL="https://tdqmiagcwnwfrsplsctd.supabase.co";
const KEY="sb_publishable_txxhEzWBGgGXx_7vm2xiJg_OX5mKBjr";

let token=null;

async function login(){

const email=document.getElementById("email").value;
const password=document.getElementById("password").value;

const r=await fetch(URL+"/auth/v1/token?grant_type=password",{
method:"POST",
headers:{
apikey:KEY,
"Content-Type":"application/json"
},
body:JSON.stringify({
email:email,
password:password
})
});

const data=await r.json();

if(!r.ok){
document.getElementById("loginMsg").innerText=
"❌ البريد أو كلمة المرور غير صحيحة";
return;
}

token=data.access_token;

document.getElementById("login").style.display="none";
document.getElementById("admin").style.display="block";

loadOrders();
}

async function loadOrders(){

const r=await fetch(
URL+"/rest/v1/orders?select=*&order=created_at.desc",
{
headers:{
apikey:KEY,
Authorization:"Bearer "+token
}
}
);

const orders=await r.json();

if(!Array.isArray(orders)){
document.getElementById("orders").innerText="❌ تعذر تحميل الطلبات";
return;
}

document.getElementById("orders").innerHTML=orders.map(o=>`

<div class="order">

<b>الطلب #${o.id}</b>

<p>👤 ${o.customer_name}</p>
<p>📞 ${o.customer_contact}</p>
<p>🎮 ${o.game_account||"-"}</p>
<p>💳 ${o.card_code||"-"}</p>
<p>💰 ${o.price} DT</p>
<p>📅 ${o.created_at||"-"}</p>

<select onchange="updateStatus(${o.id},this.value)">
<option value="pending" ${o.status==="pending"?"selected":""}>🟡 Pending</option>
<option value="completed" ${o.status==="completed"?"selected":""}>🟢 Completed</option>
<option value="cancelled" ${o.status==="cancelled"?"selected":""}>🔴 Cancelled</option>
</select>

</div>

`).join("");
}

async function updateStatus(id,status){

await fetch(URL+"/rest/v1/orders?id=eq."+id,{
method:"PATCH",
headers:{
apikey:KEY,
Authorization:"Bearer "+token,
"Content-Type":"application/json"
},
body:JSON.stringify({status:status})
});

loadOrders();
}

function logout(){
token=null;
document.getElementById("admin").style.display="none";
document.getElementById("login").style.display="block";
}
</script>

</body>
</html>
